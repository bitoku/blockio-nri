apiVersion: v1
kind: Pod
metadata:
  name: io-limited-pod
  annotations:
    # Apply the "LowPrioThrottled" blockio class to all containers in this pod.
    # Classes are defined in the plugin's ConfigMap.
    io-limits.noderesource.dev: LowPrioThrottled
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: per-container-io-limits
  annotations:
    # Different classes for different containers.
    io-limits.noderesource.dev/container.writer: LowPrioThrottled
    io-limits.noderesource.dev/container.reader: HighPrioFullSpeed
spec:
  containers:
    - name: writer
      image: busybox
      command: ["sleep", "infinity"]
    - name: reader
      image: busybox
      command: ["sleep", "infinity"]
